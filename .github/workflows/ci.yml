name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Tests
        run: npm test

      - name: Build and package
        run: npm run package

      - name: Lint Firefox build
        run: npm run lint:firefox

      - name: Upload extension zips
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: tempo-extension
          path: dist/*.zip
